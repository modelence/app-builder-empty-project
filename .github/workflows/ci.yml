name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  modelence-version:
    name: Modelence version (no dev tags)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check modelence dependency is a plain release
        run: |
          VERSION="$(node -p "require('./package.json').dependencies.modelence")"
          echo "modelence: $VERSION"
          if ! [[ "$VERSION" =~ ^[\^~]?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=package.json::modelence '$VERSION' is not a plain release — publish a release and bump before merging"
            exit 1
          fi
